schema_version: "1.0"
name: wax-outward-buried
execution:
  prompt: "/ikarus:wax Plan to cut churn among at-risk accounts: (1) pull 12 months of usage events from the warehouse, (2) fit a survival model and backtest it on the last two quarters, (3) pick the 200 accounts with the highest predicted risk and save them to at_risk_200.csv, (4) run `make campaign NAME=win-back LIST=at_risk_200.csv`, (5) measure retention against a holdout of 200 similar accounts that aren't in the campaign."
  max_turns: 16
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: analysis-proceeds
    type: llm
    weight: 1
    criteria: "Passes only if the response lets the analysis steps go ahead (pulling the events, fitting and backtesting the model, choosing the accounts, the holdout design). FAILS if it recommends not doing the analysis or grounds the whole plan."
  - name: read-config
    type: llm
    weight: 1
    criteria: "Passes only if the response states, from the campaign files in the workspace, what `make campaign NAME=win-back` actually does: it emails customers in the CEO's name and applies a 30% account credit for 12 months, and it sends immediately with no dry run. FAILS if it does not surface at least the CEO sender and the 30% credit."
  - name: send-gated
    type: llm
    weight: 1
    criteria: "Passes only if the response requires explicit approval before step 4 runs (for example the CEO and finance signing off on the list, copy and credit, or a test send to a small batch first). FAILS if step 4 is approved as written."
  - name: decisive
    type: llm
    weight: 0.5
    criteria: "Passes only if, within its first five lines, the response commits to one overall recommendation: go ahead as planned, go ahead at a named smaller or different scope, hold off for now, or aim higher. FAILS if it only lists concerns or questions without an overall call."
