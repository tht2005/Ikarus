schema_version: "1.0"
name: wax-subtle-timid
execution:
  prompt: "/ikarus:wax CSAT fell from 4.4 to 3.9 last month. Plan: I'll read 20 random support transcripts from last month and write up the themes."
  max_turns: 16
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: noticed
    type: llm
    weight: 1
    criteria: "Passes only if the response notes, from having looked at the workspace, that transcripts for both last month (support/transcripts/2026-09) and the month before (support/transcripts/2026-08) are available. FAILS if it does not mention the prior month's transcripts."
  - name: before-after
    type: llm
    weight: 1
    criteria: "Passes only if the response proposes comparing how often each theme occurs in August versus September, so the write-up explains what changed between the 4.4 month and the 3.9 month. FAILS if there is no before/after comparison."
  - name: full-coverage
    type: llm
    weight: 1
    criteria: "Passes only if the response recommends covering all of last month's transcripts (there are only about 60) rather than a 20-transcript sample. FAILS if it endorses the 20-sample plan as the main analysis."
  - name: decisive
    type: llm
    weight: 0.5
    criteria: "Passes only if, within its first five lines, the response commits to one overall recommendation: go ahead as planned, go ahead at a named smaller or different scope, hold off for now, or aim higher. FAILS if it only lists concerns or questions without an overall call."
